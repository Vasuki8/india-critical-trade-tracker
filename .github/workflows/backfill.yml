name: Backfill TradeStat history

on:
  workflow_dispatch:
    inputs:
      start_period:
        description: "First calendar month (YYYY-MM)"
        required: true
        default: "2025-01"
        type: string
      end_period:
        description: "Last calendar month (YYYY-MM)"
        required: true
        default: "2025-12"
        type: string
      commodity:
        description: "Commodity id, or 'all'"
        required: true
        default: "all"
        type: string
      value_type:
        description: "TradeStat series"
        required: true
        default: "usd"
        type: choice
        options:
          - usd
          - quantity
      trade_type:
        description: "Trade direction"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - import
          - export

permissions:
  contents: write

concurrency:
  group: tradestat-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Validate range and generate months
        env:
          START_PERIOD: ${{ inputs.start_period }}
          END_PERIOD: ${{ inputs.end_period }}
          COMMODITY: ${{ inputs.commodity }}
          VALUE_TYPE: ${{ inputs.value_type }}
        run: |
          uv run python - <<'PY' > /tmp/backfill-periods.txt
          import os, re

          start = os.environ['START_PERIOD']
          end = os.environ['END_PERIOD']
          commodity = os.environ['COMMODITY']
          value_type = os.environ['VALUE_TYPE']

          pattern = re.compile(r'^\d{4}-(0[1-9]|1[0-2])$')
          if not pattern.fullmatch(start) or not pattern.fullmatch(end):
              raise SystemExit('start_period and end_period must be YYYY-MM')
          if start > end:
              raise SystemExit('start_period must be <= end_period')

          sy, sm = map(int, start.split('-'))
          ey, em = map(int, end.split('-'))
          span = (ey - sy) * 12 + em - sm + 1
          limit = 36 if commodity != 'all' or value_type == 'quantity' else 12
          if span > limit:
              raise SystemExit(
                  f'range is {span} months; limit is {limit} months for this request. '
                  'Run historical backfill in smaller batches.'
              )

          year, month = sy, sm
          while (year, month) <= (ey, em):
              print(f'{year:04d}-{month:02d}')
              month += 1
              if month == 13:
                  month = 1
                  year += 1
          PY
          cat /tmp/backfill-periods.txt
      - name: Backfill official observations
        env:
          COMMODITY: ${{ inputs.commodity }}
          VALUE_TYPE: ${{ inputs.value_type }}
          TRADE_TYPE: ${{ inputs.trade_type }}
        shell: bash
        run: |
          args=(--trade-type "$TRADE_TYPE" --value-type "$VALUE_TYPE" --year-type calendar --no-build-dashboard)
          if [[ "$COMMODITY" != "all" ]]; then
            args+=(--commodity "$COMMODITY")
          fi
          while IFS= read -r period; do
            echo "=== Backfilling $period ==="
            uv run python scripts/ingest_tradestat.py --period "$period" "${args[@]}"
          done < /tmp/backfill-periods.txt
      - name: Rebuild dashboard
        run: uv run python scripts/build_dashboard.py
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
      - name: Commit historical data
        env:
          START_PERIOD: ${{ inputs.start_period }}
          END_PERIOD: ${{ inputs.end_period }}
          VALUE_TYPE: ${{ inputs.value_type }}
        run: |
          if git diff --quiet; then
            echo "No repository data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/observations/
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: backfill TradeStat ${VALUE_TYPE} ${START_PERIOD} to ${END_PERIOD}"
          git pull --rebase origin main
          git push origin HEAD:main
