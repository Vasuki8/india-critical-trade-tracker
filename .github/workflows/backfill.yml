name: Backfill TradeStat history

on:
  workflow_dispatch:
    inputs:
      start_period:
        description: "First calendar month (YYYY-MM)"
        required: true
        default: "2025-01"
        type: string
      end_period:
        description: "Last calendar month (YYYY-MM)"
        required: true
        default: "2025-12"
        type: string
      commodity:
        description: "Commodity id, or 'all'"
        required: true
        default: "all"
        type: string
      value_type:
        description: "TradeStat series"
        required: true
        default: "usd"
        type: choice
        options:
          - usd
          - quantity
      trade_type:
        description: "Trade direction"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - import
          - export
      force:
        description: "Refetch observations that are already current"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tradestat-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Preview resumable backfill plan
        env:
          START_PERIOD: ${{ inputs.start_period }}
          END_PERIOD: ${{ inputs.end_period }}
          COMMODITY: ${{ inputs.commodity }}
          VALUE_TYPE: ${{ inputs.value_type }}
          TRADE_TYPE: ${{ inputs.trade_type }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=(
            --start-period "$START_PERIOD"
            --end-period "$END_PERIOD"
            --value-type "$VALUE_TYPE"
            --trade-type "$TRADE_TYPE"
            --dry-run
          )
          if [[ "$COMMODITY" != "all" ]]; then
            args+=(--commodity "$COMMODITY")
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          uv run python scripts/backfill_tradestat.py "${args[@]}" | tee /tmp/backfill-plan.log
          {
            echo "### TradeStat backfill plan"
            echo '```text'
            tail -n 40 /tmp/backfill-plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Backfill missing or stale official observations
        env:
          START_PERIOD: ${{ inputs.start_period }}
          END_PERIOD: ${{ inputs.end_period }}
          COMMODITY: ${{ inputs.commodity }}
          VALUE_TYPE: ${{ inputs.value_type }}
          TRADE_TYPE: ${{ inputs.trade_type }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=(
            --start-period "$START_PERIOD"
            --end-period "$END_PERIOD"
            --value-type "$VALUE_TYPE"
            --trade-type "$TRADE_TYPE"
          )
          if [[ "$COMMODITY" != "all" ]]; then
            args+=(--commodity "$COMMODITY")
          fi
          if [[ "$FORCE" == "true" ]]; then
            args+=(--force)
          fi
          uv run python scripts/backfill_tradestat.py "${args[@]}" | tee /tmp/backfill-run.log
          summary=$(grep '^BACKFILL_SUMMARY ' /tmp/backfill-run.log | tail -n 1 || true)
          if [[ -n "$summary" ]]; then
            echo "### Backfill result" >> "$GITHUB_STEP_SUMMARY"
            echo "\`$summary\`" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
      - name: Commit historical data
        env:
          START_PERIOD: ${{ inputs.start_period }}
          END_PERIOD: ${{ inputs.end_period }}
          VALUE_TYPE: ${{ inputs.value_type }}
        run: |
          if git diff --quiet; then
            echo "No repository data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/observations/
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: backfill TradeStat ${VALUE_TYPE} ${START_PERIOD} to ${END_PERIOD}"
          git pull --rebase origin main
          git push origin HEAD:main
