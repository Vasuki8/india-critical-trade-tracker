name: Backfill TradeStat history

on:
  workflow_dispatch:
    inputs:
      start_period:
        description: "First calendar month (YYYY-MM)"
        required: true
        default: "2024-01"
        type: string
      end_period:
        description: "Last calendar month (YYYY-MM)"
        required: true
        default: "2024-12"
        type: string
      commodity:
        description: "Commodity id, or 'all'"
        required: true
        default: "all"
        type: string
      value_type:
        description: "TradeStat series"
        required: true
        default: "usd"
        type: choice
        options:
          - usd
          - quantity
          - both
      trade_type:
        description: "Trade direction"
        required: true
        default: "both"
        type: choice
        options:
          - both
          - import
          - export
      force:
        description: "Refetch observations that are already current"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: tradestat-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_PERIOD: ${{ inputs.start_period }}
      END_PERIOD: ${{ inputs.end_period }}
      COMMODITY: ${{ inputs.commodity }}
      VALUE_TYPE: ${{ inputs.value_type }}
      TRADE_TYPE: ${{ inputs.trade_type }}
      FORCE: ${{ inputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Preview resumable backfill plan
        shell: bash
        run: |
          value_types=("$VALUE_TYPE")
          if [[ "$VALUE_TYPE" == "both" ]]; then
            value_types=(usd quantity)
          fi

          : > /tmp/backfill-plan.log
          for value_type in "${value_types[@]}"; do
            echo "=== ${value_type} ===" | tee -a /tmp/backfill-plan.log
            args=(
              --start-period "$START_PERIOD"
              --end-period "$END_PERIOD"
              --value-type "$value_type"
              --trade-type "$TRADE_TYPE"
              --dry-run
            )
            if [[ "$COMMODITY" != "all" ]]; then
              args+=(--commodity "$COMMODITY")
            fi
            if [[ "$FORCE" == "true" ]]; then
              args+=(--force)
            fi
            uv run python scripts/backfill_tradestat.py "${args[@]}" | tee -a /tmp/backfill-plan.log
          done

          {
            echo "### TradeStat backfill plan"
            echo '```text'
            tail -n 80 /tmp/backfill-plan.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Backfill missing or stale official observations
        shell: bash
        run: |
          value_types=("$VALUE_TYPE")
          if [[ "$VALUE_TYPE" == "both" ]]; then
            value_types=(usd quantity)
          fi

          : > /tmp/backfill-run.log
          for value_type in "${value_types[@]}"; do
            echo "=== ${value_type} ===" | tee -a /tmp/backfill-run.log
            args=(
              --start-period "$START_PERIOD"
              --end-period "$END_PERIOD"
              --value-type "$value_type"
              --trade-type "$TRADE_TYPE"
            )
            if [[ "$COMMODITY" != "all" ]]; then
              args+=(--commodity "$COMMODITY")
            fi
            if [[ "$FORCE" == "true" ]]; then
              args+=(--force)
            fi
            uv run python scripts/backfill_tradestat.py "${args[@]}" | tee -a /tmp/backfill-run.log
          done

          {
            echo "### Backfill result"
            grep '^BACKFILL_SUMMARY ' /tmp/backfill-run.log || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
      - name: Commit historical data
        run: |
          if git diff --quiet; then
            echo "No repository data change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/observations/ data/revisions/
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: backfill TradeStat ${VALUE_TYPE} ${START_PERIOD} to ${END_PERIOD}"
          git pull --rebase origin main
          git push origin HEAD:main
