name: Bootstrap Batteries quantity history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-batteries-quantity.yml"

permissions:
  contents: write

concurrency:
  # Serialize with source-watch and all other TradeStat data writers.
  group: tradestat-data-writer
  cancel-in-progress: false

jobs:
  backfill-batteries-quantity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Preview Batteries quantity plan
        run: |
          uv run python scripts/backfill_tradestat.py --start-period 2018-01 --end-period 2020-12 --commodity batteries --value-type quantity --trade-type both --dry-run
          uv run python scripts/backfill_tradestat.py --start-period 2021-01 --end-period 2023-12 --commodity batteries --value-type quantity --trade-type both --dry-run
          uv run python scripts/backfill_tradestat.py --start-period 2024-01 --end-period 2026-06 --commodity batteries --value-type quantity --trade-type both --dry-run
      - name: Backfill Batteries quantity 2018-2020
        run: uv run python scripts/backfill_tradestat.py --start-period 2018-01 --end-period 2020-12 --commodity batteries --value-type quantity --trade-type both --no-build-dashboard
      - name: Backfill Batteries quantity 2021-2023
        run: uv run python scripts/backfill_tradestat.py --start-period 2021-01 --end-period 2023-12 --commodity batteries --value-type quantity --trade-type both --no-build-dashboard
      - name: Backfill Batteries quantity 2024-2026
        run: uv run python scripts/backfill_tradestat.py --start-period 2024-01 --end-period 2026-06 --commodity batteries --value-type quantity --trade-type both --no-build-dashboard
      - name: Mark Batteries quantity history complete
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/commodities.json')
          doc = json.loads(path.read_text(encoding='utf-8'))
          batteries = next(item for item in doc['commodities'] if item['id'] == 'batteries')
          batteries['quantity_mapping']['history_complete_from'] = '2018-01'
          path.write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Rebuild dashboard from stored observations
        run: uv run python scripts/build_dashboard.py
      - name: Rebuild revision comparison summary
        run: uv run python scripts/build_revision_summary.py
      - name: Rebuild commodity intelligence
        run: uv run python scripts/build_intelligence.py
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
      - name: Commit Batteries quantity history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/commodities.json data/dashboard.json data/revision_summary.json data/observations/
          if [[ -d data/intelligence ]]; then
            git add data/intelligence/
          fi
          if [[ -d data/revisions ]]; then
            git add data/revisions/
          fi
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: backfill Batteries quantity history"
          git pull --rebase origin main
          git push origin HEAD:main
