name: Bootstrap Rare Earth quantity history

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-rare-earth-quantity.yml"

permissions:
  contents: write

concurrency:
  # Serialize with source-watch and all other workflows that commit TradeStat data.
  group: tradestat-data-writer
  cancel-in-progress: false

jobs:
  backfill-rare-earth-quantity:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Preview Rare Earth quantity plan
        run: |
          uv run python scripts/backfill_tradestat.py --start-period 2018-01 --end-period 2020-12 --commodity rare_earths --value-type quantity --trade-type both --dry-run
          uv run python scripts/backfill_tradestat.py --start-period 2021-01 --end-period 2023-12 --commodity rare_earths --value-type quantity --trade-type both --dry-run
          uv run python scripts/backfill_tradestat.py --start-period 2024-01 --end-period 2026-06 --commodity rare_earths --value-type quantity --trade-type both --dry-run
      - name: Backfill Rare Earth quantity 2018-2020
        run: uv run python scripts/backfill_tradestat.py --start-period 2018-01 --end-period 2020-12 --commodity rare_earths --value-type quantity --trade-type both --no-build-dashboard
      - name: Backfill Rare Earth quantity 2021-2023
        run: uv run python scripts/backfill_tradestat.py --start-period 2021-01 --end-period 2023-12 --commodity rare_earths --value-type quantity --trade-type both --no-build-dashboard
      - name: Backfill Rare Earth quantity 2024-2026
        run: uv run python scripts/backfill_tradestat.py --start-period 2024-01 --end-period 2026-06 --commodity rare_earths --value-type quantity --trade-type both --no-build-dashboard
      - name: Rebuild dashboard from stored observations
        run: uv run python scripts/build_dashboard.py
      - name: Rebuild revision comparison summary
        run: uv run python scripts/build_revision_summary.py
      - name: Rebuild commodity intelligence
        run: uv run python scripts/build_intelligence.py
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
      - name: Commit Rare Earth quantity history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/revision_summary.json data/observations/
          if [[ -d data/intelligence ]]; then
            git add data/intelligence/
          fi
          if [[ -d data/revisions ]]; then
            git add data/revisions/
          fi
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: backfill Rare Earth quantity history"
          git pull --rebase origin main
          git push origin HEAD:main
