name: Generate multi-parent quantity rollup patch

on:
  push:
    branches:
      - ops/generate-multi-parent-rollup
    paths:
      - ".github/workflows/generate-multi-parent-rollup.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feature/multi-parent-quantity-rollup-v2
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Apply rollup patch
        run: uv run python tools/generate_multi_parent_rollup_patch.py
      - name: Run focused regression tests
        run: uv run pytest -q tests/test_derived.py tests/test_commodity_master.py
      - name: Run full validation
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
      - name: Commit patch to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/generate_multi_parent_rollup_patch.py
          git add src/tracker/derived.py src/tracker/mapping_quality.py tests/test_derived.py tests/test_commodity_master.py
          git commit -m "Support multi-parent quantity rollups"
          git push origin HEAD:feature/multi-parent-quantity-rollup-v2
