name: Probe Cobalt quantity units

on:
  workflow_dispatch:
  push:
    branches: [feature/quantity-unit-probe]
    paths:
      - "scripts/probe_quantity_units.py"
      - "tests/test_probe_quantity_units.py"
      - ".github/workflows/probe-cobalt-quantity.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Test quantity-unit probe
        run: uv run pytest -q tests/test_probe_quantity_units.py
      - name: Probe Cobalt mass-unit compatibility
        shell: bash
        run: |
          uv run python scripts/probe_quantity_units.py \
            --hs-code 26050000 \
            --hs-code 81052010 \
            --hs-code 81052020 \
            --hs-code 81052030 \
            --hs-code 81053000 \
            --hs-code 81059000 \
            --period 2018-01 \
            --period 2021-01 \
            --period 2022-03 \
            --period 2026-06 \
            --trade-type both \
            --require-canonical-unit KGS \
            --delay-seconds 0.5 | tee /tmp/cobalt-probe.log

          {
            echo "### Cobalt quantity-unit probe"
            echo '```text'
            grep '^PROBE_SUMMARY ' /tmp/cobalt-probe.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
