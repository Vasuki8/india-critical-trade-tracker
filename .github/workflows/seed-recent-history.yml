name: Seed recent TradeStat history

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/seed-recent-history.yml"

permissions:
  contents: write

concurrency:
  group: tradestat-history-backfill
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Backfill March-May 2026 USD history
        run: |
          uv run python scripts/backfill_tradestat.py \
            --start-period 2026-03 \
            --end-period 2026-05 \
            --value-type usd \
            --trade-type both \
            --no-build-dashboard
      - name: Backfill March-May 2026 HS8 quantity history
        run: |
          uv run python scripts/backfill_tradestat.py \
            --start-period 2026-03 \
            --end-period 2026-05 \
            --value-type quantity \
            --trade-type both \
            --no-build-dashboard
      - name: Rebuild dashboard once
        run: uv run python scripts/build_dashboard.py
      - name: Validate seeded history
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
      - name: Commit recent history
        run: |
          if git diff --quiet; then
            echo "Recent history already current; no data commit needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json data/observations/
          if git diff --cached --quiet; then
            echo "No tracked historical data change"
            exit 0
          fi
          git commit -m "data: seed TradeStat history Mar-May 2026"
          git pull --rebase origin main
          git push origin HEAD:main
