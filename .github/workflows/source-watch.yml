name: Update TradeStat data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "src/tracker/**"
      - "scripts/**"
      - "data/commodities.json"
      - "pyproject.toml"
      - ".github/workflows/source-watch.yml"

permissions:
  contents: write

concurrency:
  group: tradestat-source-watch
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Preserve previous source status
        run: cp data/source_status.json /tmp/source_status_before.json
      - name: Check official TradeStat source
        run: uv run python scripts/check_source.py
      - name: Decide which ingestion layers are needed
        id: decision
        shell: bash
        run: |
          uv run python - <<'PY'
          import json, os
          from pathlib import Path

          from scripts.ingest_tradestat import hs_codes_for_period, is_queryable_commodity
          from src.tracker.releases import revision_refresh_range

          before = json.loads(Path('/tmp/source_status_before.json').read_text())
          after = json.loads(Path('data/source_status.json').read_text())
          dashboard = json.loads(Path('data/dashboard.json').read_text())
          master = json.loads(Path('data/commodities.json').read_text())

          fields = ['data_available', 'last_updated', 'final_through', 'revised_final_through']
          source_changed = any(before.get(k) != after.get(k) for k in fields)
          revision_range = revision_refresh_range(before, after)
          awaiting_usd = not dashboard.get('as_of') or dashboard.get('status') == 'awaiting_trade_ingestion'

          def load_observation(path: Path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except (OSError, json.JSONDecodeError):
                  return None

          def mapping_needs_refresh(path: Path, expected_codes: list[str]) -> bool:
              doc = load_observation(path)
              if doc is None:
                  return True
              commodity = doc.get('commodity', {})
              stored_codes = commodity.get('canonical_hs_codes') or commodity.get('hs_codes') or []
              return list(stored_codes) != list(expected_codes)

          def quantity_observation_needs_refresh(path: Path, expected_codes: list[str]) -> bool:
              doc = load_observation(path)
              if doc is None:
                  return True
              commodity = doc.get('commodity', {})
              stored_codes = commodity.get('canonical_hs_codes') or commodity.get('hs_codes') or []
              if list(stored_codes) != list(expected_codes):
                  return True
              if doc.get('quantity_scale_to_source_unit') != 1:
                  return True
              reports = doc.get('reports', [])
              if any(report.get('quantity_scale_to_source_unit') != 1 for report in reports):
                  return True
              return any(report.get('value_selector_code') != '2' for report in reports)

          as_of = dashboard.get('as_of')
          usd_missing_or_stale = []
          quantity_missing_or_stale = []
          if as_of:
              for commodity in master.get('commodities', []):
                  usd_codes, _ = hs_codes_for_period(commodity, as_of, value_type='usd')
                  usd_ready, _ = is_queryable_commodity(
                      commodity,
                      value_type='usd',
                      hs_codes=usd_codes,
                  )
                  if usd_ready and usd_codes:
                      usd_path = Path('data/observations') / as_of / f"{commodity['id']}.usd.json"
                      if mapping_needs_refresh(usd_path, usd_codes):
                          usd_missing_or_stale.append(commodity['id'])

                  quantity_codes, _ = hs_codes_for_period(commodity, as_of, value_type='quantity')
                  quantity_ready, _ = is_queryable_commodity(
                      commodity,
                      value_type='quantity',
                      hs_codes=quantity_codes,
                  )
                  if quantity_ready and quantity_codes:
                      quantity_path = Path('data/observations') / as_of / f"{commodity['id']}.quantity.json"
                      if quantity_observation_needs_refresh(quantity_path, quantity_codes):
                          quantity_missing_or_stale.append(commodity['id'])

          ingest_usd = source_changed or awaiting_usd or bool(usd_missing_or_stale)
          ingest_quantity = source_changed or awaiting_usd or bool(quantity_missing_or_stale)
          refresh_revisions = revision_range is not None
          revision_start, revision_end = revision_range or ('', '')

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              f.write(f"source_changed={'true' if source_changed else 'false'}\n")
              f.write(f"ingest_usd={'true' if ingest_usd else 'false'}\n")
              f.write(f"ingest_quantity={'true' if ingest_quantity else 'false'}\n")
              f.write(f"refresh_revisions={'true' if refresh_revisions else 'false'}\n")
              f.write(f"revision_start={revision_start}\n")
              f.write(f"revision_end={revision_end}\n")

          print({
              'source_changed': source_changed,
              'awaiting_usd': awaiting_usd,
              'usd_missing_or_stale': usd_missing_or_stale,
              'quantity_missing_or_stale': quantity_missing_or_stale,
              'ingest_usd': ingest_usd,
              'ingest_quantity': ingest_quantity,
              'revision_range': revision_range,
          })
          PY
      - name: Ingest latest critical-commodity USD month
        if: steps.decision.outputs.ingest_usd == 'true'
        run: uv run python scripts/ingest_tradestat.py --latest --trade-type both --value-type usd --year-type calendar --no-build-dashboard
      - name: Ingest latest HS8 quantity month
        if: steps.decision.outputs.ingest_quantity == 'true'
        run: uv run python scripts/ingest_tradestat.py --latest --trade-type both --value-type quantity --year-type calendar --no-build-dashboard
      - name: Refresh revised-final USD history
        if: steps.decision.outputs.refresh_revisions == 'true'
        run: |
          uv run python scripts/backfill_tradestat.py \
            --start-period "${{ steps.decision.outputs.revision_start }}" \
            --end-period "${{ steps.decision.outputs.revision_end }}" \
            --value-type usd --trade-type both --force --no-build-dashboard
      - name: Refresh revised-final HS8 quantity history
        if: steps.decision.outputs.refresh_revisions == 'true'
        run: |
          uv run python scripts/backfill_tradestat.py \
            --start-period "${{ steps.decision.outputs.revision_start }}" \
            --end-period "${{ steps.decision.outputs.revision_end }}" \
            --value-type quantity --trade-type both --force --no-build-dashboard
      - name: Rebuild dashboard from stored observations
        run: uv run python scripts/build_dashboard.py
      - name: Rebuild revision comparison summary
        run: uv run python scripts/build_revision_summary.py
      - name: Rebuild commodity intelligence
        run: uv run python scripts/build_intelligence.py
      - name: Validate generated data
        run: |
          uv run python scripts/validate_data.py
          uv run pytest -q
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
      - name: Ignore timestamp-only source check
        if: steps.decision.outputs.ingest_usd != 'true' && steps.decision.outputs.ingest_quantity != 'true' && steps.decision.outputs.refresh_revisions != 'true'
        run: git checkout -- data/source_status.json
      - name: Commit official data changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_status.json data/dashboard.json data/revision_summary.json data/observations/
          if [[ -d data/intelligence ]]; then
            git add data/intelligence/
          fi
          if [[ -d data/revisions ]]; then
            git add data/revisions/
          fi
          if git diff --cached --quiet; then
            echo "No tracked data change"
            exit 0
          fi
          git commit -m "data: update TradeStat critical commodities"
          git pull --rebase origin main
          git push origin HEAD:main
