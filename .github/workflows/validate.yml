name: Validate tracker data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Build commodity intelligence
        run: uv run python scripts/build_intelligence.py
      - name: Verify national data and generated payloads
        run: |
          uv run python scripts/ingest_national.py --build-only
          git diff --exit-code -- data/national/
      - name: Validate trade data
        run: uv run python scripts/validate_data.py
      - name: Run tests
        run: uv run pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
          node --check assets/js/national.js
