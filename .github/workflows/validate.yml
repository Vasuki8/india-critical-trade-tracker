name: Validate tracker data

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install Python
        run: uv python install 3.12
      - name: Sync dependencies
        run: uv sync --dev
      - name: Build commodity intelligence
        run: uv run python scripts/build_intelligence.py
      - name: Validate commodity master
        run: uv run python scripts/validate_data.py
      - name: Run tests
        run: uv run pytest -q
      - name: Check dashboard JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/intelligence.js
          node --check assets/js/portfolio.js
