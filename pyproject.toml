[project]
name = "india-critical-trade-tracker"
version = "0.3.0"
description = "India merchandise import-export dashboard with national, commodity, partner, and critical watchlist views powered by official TradeStat/DGCI&S data."
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12.3",
  "requests>=2.32.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
